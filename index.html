                <button class="btn-success" onclick="stealCorrect()">✓ Steal Successful!</button>
                <button class="btn-fail" onclick="answerWrong()">✗ Steal Failed</button>
            `;
        }

        function stealCorrect() {
            const stealer = currentTurn === 'jim' ? 'emma' : 'jim';
            scores.stolen++;
            
            // Stealer wins the card
            if (stealer === 'jim') {
                scores.jim++;
            } else {
                scores.emma++;
            }
            
            saveFavorite(currentAction, stealer);
            saveData();
            updateScores();
            
            // Switch to stealer's turn (normal rotation)
            currentTurn = stealer;
            updateTurnDisplay();
            
            showWin(stealer, true);
        }

        function showWin(winner, wasStolen = false) {
            const gameArea = document.getElementById('game-area');
            const buttons = document.getElementById('action-buttons');
            
            gameArea.innerHTML = `
                <div class="card-number" style="color: ${wasStolen ? '#e94560' : '#00b894'};">#${currentAction.num}</div>
                <div class="stolen-banner" style="background: ${wasStolen ? 'linear-gradient(135deg, #e94560, #ff6b6b)' : 'linear-gradient(135deg, #00b894, #00cec9)'};">
                    ${wasStolen ? '🔥 STOLEN!' : '🎉 YOU WON!'}
                </div>
                <div class="card-category">${currentAction.cat}</div>
                <div class="card-text">${currentAction.text}</div>
                <div style="margin-top: 20px; color: #888; font-size: 0.9rem;">
                    ${wasStolen ? 'Card stolen! Next turn:' : 'Next turn:'}
                </div>
            `;
            
            // Next player draws
            const nextPlayer = currentTurn === 'jim' ? 'Emma' : 'Jim';
            buttons.innerHTML = `
                <button class="btn-primary ${currentTurn === 'emma' ? 'emma' : ''}" onclick="drawCard()">${nextPlayer} Draws Card</button>
            `;
        }

        function skipSteal() {
            gameState = 'missed';
            showNobodyWins();
        }

        function showNobodyWins() {
            const gameArea = document.getElementById('game-area');
            const buttons = document.getElementById('action-buttons');
            
            gameArea.innerHTML = `
                <div class="missed-out">
                    <div class="missed-title">❌ NOBODY WINS</div>
                    <div class="card-number" style="font-size: 1.5rem; color: #666;">#${currentAction.num}</div>
                    <div class="missed-action">${currentAction.text}</div>
                </div>
            `;
            
            // Switch to other player
            const nextPlayer = currentTurn === 'jim' ? 'Emma' : 'Jim';
            currentTurn = currentTurn === 'jim' ? 'emma' : 'jim';
            updateTurnDisplay();
            
            buttons.innerHTML = `
                <button class="btn-primary ${currentTurn === 'emma' ? 'emma' : ''}" onclick="drawCard()">${nextPlayer} Draws Card</button>
            `;
        }

        function showFavorites() {
            document.getElementById('game-section').style.display = 'none';
            document.getElementById('favorites-section').style.display = 'block';
            
            const favorites = getFavorites();
            const list = document.getElementById('favorites-list');
            
            if (favorites.length === 0) {
                list.innerHTML = '<div class="empty-state">No cards won yet!</div>';
                return;
            }
            
            let html = '';
            favorites.forEach(fav => {
                html += `<div class="favorite-item ${fav.winner}">
                    <div class="favorite-date">${fav.date} <span class="winner-tag ${fav.winner}">Won by ${fav.winner === 'jim' ? 'Jim' : 'Emma'}</span></div>
                    <div style="color: #888; font-size: 0.75rem; margin-bottom: 5px;">#${fav.num} - ${fav.cat}</div>
                    <div>${fav.text}</div>
                </div>`;
            });
            
            list.innerHTML = html;
        }

        function showGame() {
            document.getElementById('favorites-section').style.display = 'none';
            document.getElementById('game-section').style.display = 'block';
        }

        loadData();
        
        document.getElementById('action-buttons').innerHTML = `
            <button class="btn-primary ${currentTurn === 'emma' ? 'emma' : ''}" onclick="drawCard()">🎲 Draw Card</button>
        `;
    </script>
</body>
</html>
